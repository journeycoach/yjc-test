name: Weekly Sanity Backup
on:
  schedule:
    # This runs every Sunday at midnight (UTC)
    - cron: "0 0 * * 0"
  workflow_dispatch: # This lets you click a button to run a backup manually

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Export Sanity Dataset
        uses: sanity-io/github-action-sanity@v0.7-alpha
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        with:
          # This saves your data as a file named "backup.tar.gz"
          args: dataset export production backups/backup.tar.gz

      - name: Upload Backup as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanity-backup
          path: backups/backup.tar.gz
          retention-days: 30
