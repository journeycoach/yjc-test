name: Weekly Sanity Backup
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Export Sanity Dataset
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: |
          mkdir -p backups
          npx sanity dataset export production backups/backup.tar.gz --project-id 9ksnhows

      - name: Upload Backup as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanity-backup
          path: backups/backup.tar.gz
          retention-days: 30
