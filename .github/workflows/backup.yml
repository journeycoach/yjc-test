name: Weekly Sanity Backup
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Sanity CLI
        run: npm install -g @sanity/cli

      - name: Export Sanity Dataset
        shell: bash
        run: |
          mkdir -p backups
          sanity dataset export production backups/backup.tar.gz --token ${{ secrets.SANITY_AUTH_TOKEN }} --yes

      - name: Upload Backup as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanity-backup
          path: backups/backup.tar.gz
          retention-days: 30
