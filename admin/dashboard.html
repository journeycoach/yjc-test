<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Admin</title>
  <link rel="stylesheet" href="css/admin.css" />
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
</head>
<body>
  <div class="admin-wrapper">
    <header class="admin-header">
      <div class="brand">Your Journey Coach <span>Admin</span></div>
      <div class="admin-header-actions">
        <button class="btn btn-ghost btn-sm" onclick="logout()">Sign Out</button>
      </div>
    </header>

    <main class="admin-main">
      <div class="admin-page-title">
        <h1>Dashboard</h1>
        <button class="btn btn-ghost btn-sm" onclick="resetOrder()" title="Restore default card order">Reset Order</button>
      </div>

      <div class="dashboard-grid" id="dashGrid"></div>
    </main>
  </div>

  <script src="js/admin.js"></script>
  <script>
    requireAdminAuth();

    const STORAGE_KEY = 'admin_dashboard_order';

    const CARDS = [
      { key: 'settings',     href: 'settings.html',     icon: '⚙️',  title: 'Site Settings',         desc: 'Control brand colors, fonts, global CTAs, and site tagline. Changes apply across the entire site instantly.' },
      { key: 'sections',     href: 'sections.html',     icon: '📰',  title: 'Page Sections',          desc: 'Show, hide, reorder, and draft page sections. Add admin notes to any section as a reminder.' },
      { key: 'posts',        href: 'posts.html',        icon: '📝',  title: 'Blog Posts',             desc: 'Write, edit, and manage blog articles with HTML content editing and live preview.' },
      { key: 'testimonials', href: 'testimonials.html', icon: '💬',  title: 'Testimonials',           desc: 'Add and manage client testimonials displayed on the homepage.' },
      { key: 'tools',        href: 'tools.html',        icon: '🛠️',  title: 'Tools & Resources',      desc: 'Manage downloadable files and resource links shown on the Resources page.' },
      { key: 'navigation',   href: 'navigation.html',   icon: '🔗',  title: 'Navigation',             desc: 'Edit the site brand name, nav links, and the CTA button in the header.' },
      { key: 'bookmarks',    href: 'bookmarks.html',    icon: '🔖',  title: 'Bookmarks',              desc: 'Organize curated links into categories for the bookmarks section.' },
      { key: 'contacts',     href: 'contacts.html',     icon: '📩',  title: 'Contact Submissions',    desc: 'View and manage inquiries submitted through the contact form.' },
    ];

    function getSavedOrder() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const keys = JSON.parse(raw);
        if (!Array.isArray(keys)) return null;
        return keys;
      } catch { return null; }
    }

    function saveOrder(keys) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(keys));
    }

    function getOrderedCards() {
      const saved = getSavedOrder();
      if (!saved) return CARDS;
      const cardMap = Object.fromEntries(CARDS.map(c => [c.key, c]));
      const ordered = saved.map(k => cardMap[k]).filter(Boolean);
      // Append any new cards not yet in saved order
      CARDS.forEach(c => { if (!saved.includes(c.key)) ordered.push(c); });
      return ordered;
    }

    function renderGrid() {
      const grid = document.getElementById('dashGrid');
      grid.innerHTML = getOrderedCards().map(c => `
        <a href="${c.href}" class="dashboard-card" data-key="${c.key}">
          <div class="card-icon">${c.icon}</div>
          <div class="card-title">${c.title}</div>
          <div class="card-desc">${c.desc}</div>
        </a>
      `).join('');

      Sortable.create(grid, {
        animation: 150,
        ghostClass: 'sortable-ghost',
        chosenClass: 'sortable-chosen',
        onEnd() {
          const keys = Array.from(grid.querySelectorAll('.dashboard-card')).map(el => el.dataset.key);
          saveOrder(keys);
        }
      });
    }

    function resetOrder() {
      localStorage.removeItem(STORAGE_KEY);
      renderGrid();
    }

    renderGrid();
  </script>
</body>
</html>
