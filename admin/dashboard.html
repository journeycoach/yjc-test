<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Admin</title>
  <link rel="stylesheet" href="css/admin.css" />
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
</head>
<body>
  <div class="admin-wrapper">
    <header class="admin-header">
      <div class="brand">Your Journey Coach <span>Admin</span></div>
      <div class="admin-header-actions">
        <button class="btn btn-ghost btn-sm" onclick="logout()">Sign Out</button>
      </div>
    </header>

    <main class="admin-main">
      <div class="admin-page-title">
        <h1>Dashboard</h1>
        <button class="btn btn-ghost btn-sm" onclick="resetOrder()" title="Restore default card order">Reset Order</button>
      </div>

      <div class="dashboard-grid" id="dashGrid"></div>
    </main>
  </div>

  <script src="js/admin.js"></script>
  <script>
    requireAdminAuth();

    const STORAGE_KEY = 'admin_dashboard_order';

    function getIconMarkup(key) {
      const icons = {
        settings: `
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19.14 12.94a7.43 7.43 0 0 0 .05-.94 7.43 7.43 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.28 7.28 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.49-.42h-3.84a.5.5 0 0 0-.49.42l-.36 2.54a7.28 7.28 0 0 0-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.43 7.43 0 0 0-.05.94 7.43 7.43 0 0 0 .05.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.5.39 1.05.71 1.63.94l.36 2.54a.5.5 0 0 0 .49.42h3.84a.5.5 0 0 0 .49-.42l.36-2.54c.58-.23 1.13-.55 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/>
          </svg>
        `,
        sections: `
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 5h16v3H4V5Zm0 5h10v3H4v-3Zm0 5h16v4H4v-4Zm12-5h4v3h-4v-3Z"/>
          </svg>
        `,
        posts: `
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 3h10l4 4v14H5V3Zm9 1.5V8h3.5L14 4.5ZM8 11h8v1.8H8V11Zm0 4h8v1.8H8V15Z"/>
          </svg>
        `,
        testimonials: `
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 6h6v6H7.75L6 14.5V6Zm8 0h6v6h-3.25L13 14.5V6Z"/>
          </svg>
        `,
        tools: `
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m21.67 18.17-5.02-5.02a5.17 5.17 0 0 0-6.66-6.66l2.45 2.45-2.5 2.5-2.45-2.45a5.17 5.17 0 0 0 6.66 6.66l5.02 5.02a1.77 1.77 0 0 0 2.5-2.5ZM6.5 13 3 16.5V21h4.5L11 17.5 6.5 13Z"/>
          </svg>
        `,
        navigation: `
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10.59 13.41a1.99 1.99 0 0 0 2.82 0l3.59-3.59a2 2 0 1 0-2.82-2.82l-1.3 1.3 1.41 1.41 1.3-1.3a.5.5 0 0 1 .71.71l-3.59 3.59a.5.5 0 0 1-.71 0l-1.3-1.3-1.41 1.41 1.3 1.3Zm2.82-2.82a1.99 1.99 0 0 0-2.82 0L7 14.18A2 2 0 0 0 9.82 17l1.3-1.3-1.41-1.41-1.3 1.3a.5.5 0 0 1-.71-.71l3.59-3.59a.5.5 0 0 1 .71 0l1.3 1.3 1.41-1.41-1.3-1.3Z"/>
          </svg>
        `,
        bookmarks: `
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/>
          </svg>
        `,
        contacts: `
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm9 7 8-5H4l8 5Zm0 2-8-5v8h16V9l-8 5Z"/>
          </svg>
        `
      };

      return icons[key] || icons.settings;
    }

    const CARDS = [
      { key: 'settings',     href: 'settings.html',     title: 'Site Settings',         desc: 'Control brand colors, fonts, global CTAs, and site tagline. Changes apply across the entire site instantly.' },
      { key: 'sections',     href: 'sections.html',     title: 'Page Sections',          desc: 'Show, hide, reorder, and draft page sections. Add admin notes to any section as a reminder.' },
      { key: 'posts',        href: 'posts.html',        title: 'Blog Posts',             desc: 'Write, edit, and manage blog articles with HTML content editing and live preview.' },
      { key: 'testimonials', href: 'testimonials.html', title: 'Testimonials',           desc: 'Add and manage client testimonials displayed on the homepage.' },
      { key: 'tools',        href: 'tools.html',        title: 'Tools & Resources',      desc: 'Manage downloadable files and resource links shown on the Resources page.' },
      { key: 'navigation',   href: 'navigation.html',   title: 'Navigation',             desc: 'Edit the site brand name, nav links, and the CTA button in the header.' },
      { key: 'bookmarks',    href: 'bookmarks.html',    title: 'Bookmarks',              desc: 'Organize curated links into categories for the bookmarks section.' },
      { key: 'contacts',     href: 'contacts.html',     title: 'Contact Submissions',    desc: 'View and manage inquiries submitted through the contact form.' },
    ];

    function getSavedOrder() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const keys = JSON.parse(raw);
        if (!Array.isArray(keys)) return null;
        return keys;
      } catch { return null; }
    }

    function saveOrder(keys) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(keys));
    }

    function getOrderedCards() {
      const saved = getSavedOrder();
      if (!saved) return CARDS;
      const cardMap = Object.fromEntries(CARDS.map(c => [c.key, c]));
      const ordered = saved.map(k => cardMap[k]).filter(Boolean);
      // Append any new cards not yet in saved order
      CARDS.forEach(c => { if (!saved.includes(c.key)) ordered.push(c); });
      return ordered;
    }

    function renderGrid() {
      const grid = document.getElementById('dashGrid');
      grid.innerHTML = getOrderedCards().map(c => `
        <a href="${c.href}" class="dashboard-card" data-key="${c.key}">
          <div class="card-icon">${getIconMarkup(c.key)}</div>
          <div class="card-title">${c.title}</div>
          <div class="card-desc">${c.desc}</div>
        </a>
      `).join('');

      Sortable.create(grid, {
        animation: 150,
        ghostClass: 'sortable-ghost',
        chosenClass: 'sortable-chosen',
        onEnd() {
          const keys = Array.from(grid.querySelectorAll('.dashboard-card')).map(el => el.dataset.key);
          saveOrder(keys);
        }
      });
    }

    function resetOrder() {
      localStorage.removeItem(STORAGE_KEY);
      renderGrid();
    }

    renderGrid();
  </script>
</body>
</html>
